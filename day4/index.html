<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Character Counter & Dark Mode</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Note Drafter</h1>
        <button id="theme-toggle" type="button">Dark mode</button>
      </header>

      <main>
        <label for="note-text">Your Note:</label>
        <textarea
          id="note-text"
          rows="8"
          placeholder="Start typing your note here... (Esc to clear)"
        ></textarea>

        <div class="stats-panel">
          <p id="char-count">0 / 200 characters</p>
          <p id="word-count">0 words</p>
        </div>

        <button id="clear-btn" type="button">Clear Draft</button>
      </main>
    </div>
  </body>
</html>
